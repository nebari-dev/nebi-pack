name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast chart render tests (no cluster): `helm template` + assertions in
  # tests/. Kept a separate job from `integration` so it stays green and quick
  # independent of the Nebari sandbox bootstrap.
  chart:
    name: chart render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Build helm dependencies
        run: helm dependencies build

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run chart tests
        run: uv run pytest -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Full Nebari platform (NIC + ArgoCD + Keycloak + operator + gateway) so
      # the chart is exercised the way it actually runs: the operator provisions
      # the OIDC client and the gateway enforces auth.
      - uses: nebari-dev/deploy-nebari-action@main
        with:
          nic-version: latest

      # Install this chart at the commit under test and wait for the ArgoCD
      # Application's sync to succeed and for it to be Healthy.
      - uses: nebari-dev/deploy-nebari-action/add-software-pack@34df7d44f48a9077c548dd6637e8012682b4ee9d # add-software-pack branch, nebari-dev/deploy-nebari-action#49
        with:
          application-manifest: .github/ci/nebi-pack-application.yaml
          target-revision: ${{ github.sha }}

      - name: Verify operator-wired OIDC
        run: |
          # nebi keeps basic auth and gets the OIDC verifier wired in via the
          # operator-provisioned client (issuer derived from the hostname).
          env=$(kubectl get deploy -n nebi -l app.kubernetes.io/name=nebari-nebi-pack \
            -o jsonpath='{.items[0].spec.template.spec.containers[0].env[*].name}')
          echo "$env" | grep -q NEBI_AUTH_OIDC_ISSUER_URL \
            || { echo "OIDC env not wired"; exit 1; }

      - name: Verify the gateway redirects nebi to Keycloak
        # Reach the gateway through a port-forward to Envoy's LoadBalancer
        # Service rather than the LB IP, which is not routable from the
        # runner's network namespace.
        run: |
          svc=$(kubectl get svc -n envoy-gateway-system \
            -o jsonpath='{.items[?(@.spec.type=="LoadBalancer")].metadata.name}')
          kubectl port-forward -n envoy-gateway-system "svc/${svc}" 8443:443 &
          pf=$!
          trap 'kill $pf' EXIT
          for i in $(seq 1 30); do
            curl -sk -o /dev/null --connect-timeout 2 https://127.0.0.1:8443/ && break
            sleep 1
          done
          loc=$(curl -sk -o /dev/null -w '%{redirect_url}' \
            --resolve "nebi.nebari.local:8443:127.0.0.1" \
            https://nebi.nebari.local:8443/)
          echo "redirect: $loc"
          echo "$loc" | grep -q 'keycloak.nebari.local/realms/nebari/protocol/openid-connect/auth' \
            || { echo "nebi did not redirect to Keycloak"; exit 1; }
